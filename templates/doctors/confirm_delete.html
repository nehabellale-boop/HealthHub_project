{% extends 'base.html' %}

{% block title %}Delete Doctor Record - Admin Only{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6">
        <div class="card card-custom p-4 text-center">
            <div class="stat-icon bg-danger bg-opacity-10 text-danger mx-auto mb-3">
                <i class="bi bi-exclamation-octagon-fill fs-3"></i>
            </div>
            <h4 class="fw-bold mb-2">Delete Doctor Record</h4>
            <p class="text-muted mb-4">
                Are you sure you want to permanently delete the profile and user account for <strong>{{ doctor.full_name }}</strong> ({{ doctor.doctor_id }})?
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'doctor_list_admin' %}" class="btn btn-light border px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash me-1"></i> Confirm Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
