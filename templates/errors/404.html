{% extends 'base.html' %}

{% block title %}404 - Page Not Found | St. Jude Hospital{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="card card-custom p-5">
            <div class="display-1 text-primary fw-bold mb-2">404</div>
            <h3 class="fw-bold mb-3">Resource or Page Not Found</h3>
            <p class="text-muted mb-4">
                The requested hospital record, doctor profile, appointment, or invoice could not be located.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{% url 'home' %}" class="btn btn-primary"><i class="bi bi-house me-1"></i> Return Home</a>
                <a href="{% url 'dashboard_redirect' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> My Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
